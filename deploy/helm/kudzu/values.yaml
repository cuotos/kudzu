replicaCount: 2

image:
  repository: ghcr.io/cuotos/kudzu
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  port: 8080

# Tuning passed through as environment variables.
config:
  breakerFailureThreshold: 1
  requiredCheckContext: kudzu-gate
  requireReadAuth: false
  redis:
    # Used only when redis.enabled is false (external Redis). When the bundled
    # Redis below is enabled, REDIS_ADDR is derived from its Service instead.
    addr: "redis:6379"
    db: 0

# Bundled single-node Redis (Deployment + Service). Convenient for getting
# started. By default state is in-memory only, so a Redis restart clears all
# gates; enable persistence below to survive restarts. For production, consider
# disabling this and pointing config.redis.addr at an external/HA Redis.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379

  # Redis server args. Empty means the chart chooses based on
  # persistence.enabled: AOF on when persisting, fully in-memory when not.
  # Override to tune durability, e.g. RDB snapshots instead of the AOF (much
  # gentler on network filesystems):
  #   args: ["--save", "60 1000", "--appendonly", "no"]
  args: []

  # Persist /data across Redis restarts. The chart is deliberately agnostic
  # about *how* - it only needs a volume. Pick exactly one of the three routes
  # below; the chart fails the render if you set more than one.
  persistence:
    enabled: false

    # Route A - let the chart create a PersistentVolumeClaim for you. This is
    # the usual choice: name a StorageClass and your CSI driver does the rest.
    #   AWS EFS:  storageClass: efs-sc, accessModes: [ReadWriteMany]
    #   EBS/GCE PD/etc: leave accessModes at [ReadWriteOnce]
    # storageClass: "" uses the cluster default; "-" disables dynamic
    # provisioning so the claim binds to a PV you created by hand.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}
    # Keep the PVC (and your gate state) behind after `helm uninstall`.
    keepOnUninstall: true

    # Route B - a PVC you created out of band. The chart creates no PVC and
    # just mounts this claim.
    existingClaim: ""

    # Route C - escape hatch. A raw volume spec, spliced verbatim into the
    # pod's `volumes:` entry. For anything the two routes above cannot express,
    # e.g. an inline CSI volume or a plain NFS mount:
    #   volume:
    #     csi:
    #       driver: efs.csi.aws.com
    #       volumeAttributes:
    #         fileSystemId: fs-0123456789abcdef0
    volume: {}

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# All secret values are referenced from an existing Kubernetes Secret so they
# are never templated into the release. Create it out of band, e.g.:
#   kubectl create secret generic kudzu-secrets \
#     --from-literal=write-tokens=tokenA,tokenB \
#     --from-literal=redis-password=... \
#     --from-file=github-app-private-key=app.pem \
#     --from-literal=github-app-id=123456 \
#     --from-literal=github-app-installation-id=7891011
secrets:
  # Name of the pre-existing Secret holding the keys below.
  existingSecret: kudzu-secrets
  keys:
    writeTokens: write-tokens
    redisPassword: redis-password
    githubAppID: github-app-id
    githubAppInstallationID: github-app-installation-id
    githubPrivateKey: github-app-private-key   # mounted as a file

# Proactive merge-group eviction via a GitHub App. When false, a tripped
# breaker is only caught by the next merge_group gate check.
github:
  evictionEnabled: false
  apiBaseURL: "https://api.github.com/"

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: kudzu.internal.example.com
  tls: []

# Gateway API HTTPRoute — an alternative to ingress for clusters fronted by an
# API gateway / Gateway API controller. Enable exactly one of ingress or
# httpRoute. Requires the Gateway API CRDs (gateway.networking.k8s.io/v1) and a
# Gateway to attach to, referenced via parentRefs.
httpRoute:
  enabled: false
  annotations: {}
  # The Gateway(s) this route attaches to. At least one entry is required when
  # enabled. namespace/sectionName are optional.
  parentRefs:
    - name: ""
      # namespace: gateway-system
      # sectionName: https
  # Hostnames this route matches. Empty means match all hosts on the Gateway.
  hostnames:
    - kudzu.internal.example.com
  # Match rule for the single backend route to the service.
  path: /
  pathType: PathPrefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Restrict ingress to the service port. Disabled by default; set namespaceSelectors
# / podSelectors to match your CI runners and callers.
networkPolicy:
  enabled: false
  ingressFrom: []

# Prometheus Operator ServiceMonitor.
serviceMonitor:
  enabled: false
  interval: 30s

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
